name: Xcode Build
on:
  push:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    strategy:
      matrix:
        destination: ['generic/platform=macOS', 'generic/platform=iOS Simulator']
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build only (no UI tests)
        run: xcodebuild -project ios/Lumik.xcodeproj -scheme Lumik -configuration Release -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO build
        env:
          DESTINATION: ${{ matrix.destination }}
